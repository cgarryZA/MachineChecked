name: Site

# Publishes machinechecked.org: the landing page (site/) and the synthetic toy paper's public
# export (approved fields only, scanned for leaks) under /demo/. Runs from main only. Pages
# must have "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TeX Live and elan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-science texlive-fonts-recommended
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: pip install -e .
      - name: Build the site (landing page, and the toy paper's public export under /demo/)
        run: |
          cd examples/toy-paper
          machinechecked build --fail-on-violation
          machinechecked export --out ../../public/demo
          cd ../..
          cp -R site/. public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
