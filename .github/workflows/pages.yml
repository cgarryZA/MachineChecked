name: Demo audit

# Publishes the synthetic toy paper's audit (its public export: approved fields only, scanned
# for leaks, with audit.json) at cgarryza.github.io/MachineChecked/demo/, where
# machinechecked.org/demo/ reads it. The site itself is the cgarryZA/machinechecked.org
# repository. Runs from main only; Pages must have "GitHub Actions" as its source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TeX Live and elan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-science texlive-fonts-recommended
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: pip install -e .
      - name: Build the toy paper's public export under /demo/
        run: |
          cd examples/toy-paper
          machinechecked build --fail-on-violation
          machinechecked export --out ../../public/demo
          cd ../..
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>MachineChecked</title>' \
            '<meta http-equiv="refresh" content="0; url=https://machinechecked.org/">' \
            '<a href="https://machinechecked.org/">machinechecked.org</a>' > public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
