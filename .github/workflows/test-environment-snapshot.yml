name: Prepare test environment snapshot

on:
  push:
    branches: [build/epic86-test-environment]

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    if: github.repository == 'cgarryZA/MachineChecked'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: machinechecked-test-runtimes
          run-id: 39084489310
          github-token: ${{ github.token }}
          path: /tmp/runtimes
      - run: split -b 450M /tmp/runtimes/test-runtimes.tar.zst /tmp/runtime.part-
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-aa
          path: /tmp/runtime.part-aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-ab
          path: /tmp/runtime.part-ab
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-ac
          path: /tmp/runtime.part-ac
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-ad
          path: /tmp/runtime.part-ad
          retention-days: 1
          compression-level: 0
