name: MachineChecked audit

# A reusable workflow for your own repository: builds your Lean project on your Actions minutes
# (restoring a saved build when there is one, see `machinechecked cache`), writes the audit with
# `machinechecked build --site`, and uploads it as the artifact `machinechecked-audit`, ready to
# publish (for example on GitHub Pages). It runs only your own code; nothing is sent anywhere.
#
# In your repository, .github/workflows/machinechecked.yml:
#
#   on: { push: { branches: [main] }, workflow_dispatch: }
#   jobs:
#     audit:
#       uses: cgarryZA/MachineChecked/.github/workflows/audit.yml@main
#       with:
#         cache-repo: you/your-project   # optional: restore from its build-cache release
#         paper: paper/main.tex          # optional: found in the project when not given
#         tex: true                      # the paper is LaTeX: install TeX Live
#
# One repository can publish several audits, one per version of its paper (for example `/v1/`
# from a frozen Lean ref and `/latest/` from main): call this workflow once per audit with `ref`
# and `subpath`. Each call uploads its audit under that subpath, in an artifact of its own (the
# output `artifact`), and a deploy job merges them into one site (docs/GETTING_STARTED.md).
on:
  workflow_call:
    inputs:
      project-dir:
        description: the Lean project, relative to the repository root
        type: string
        default: "."
      paper:
        description: the paper (a .tex, a .pdf or a PDF's URL); found when empty
        type: string
        default: ""
      targets:
        description: Lake targets to build, space-separated (default targets when empty)
        type: string
        default: ""
      cache-repo:
        description: OWNER/REPO whose build-cache release holds saved builds (none when empty)
        type: string
        default: ""
      tex:
        description: install TeX Live, for a paper given as LaTeX
        type: boolean
        default: false
      package:
        description: what pip installs (a version such as machinechecked==0.1.6, or a path)
        type: string
        default: machinechecked
      author:
        description: the name the audit is published under (its audit.json)
        type: string
        default: ""
      ref:
        description: the Git ref (branch, tag or commit) of the Lean project to audit; the commit that triggered the run when empty
        type: string
        default: ""
      subpath:
        description: the directory of the published site the audit goes in, such as v1 or latest (the site's root when empty)
        type: string
        default: ""
    outputs:
      artifact:
        description: the name of the artifact holding the audit
        value: ${{ jobs.audit.outputs.artifact }}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.where.outputs.artifact }}
    steps:
      - name: Where the audit goes
        id: where
        env:
          SUBPATH: ${{ inputs.subpath }}
        run: |
          if [ -n "$SUBPATH" ] && ! printf '%s' "$SUBPATH" | grep -Eq '^[A-Za-z0-9_-][A-Za-z0-9._-]*(/[A-Za-z0-9_-][A-Za-z0-9._-]*)*$'; then
            echo "subpath must be a relative directory such as v1 or audits/latest: $SUBPATH" >&2
            exit 1
          fi
          echo "artifact=machinechecked-audit${SUBPATH:+-${SUBPATH//\//-}}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # the history, so a saved build of an earlier commit can be used
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The packages a run installs are kept for a week (TeX Live is several hundred MB, and
      # Ubuntu's mirror is often slow), so most runs download only what changed.
      - name: This week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Saved packages
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-audit-${{ runner.os }}-${{ inputs.tex }}-${{ steps.week.outputs.week }}
          restore-keys: apt-audit-${{ runner.os }}-${{ inputs.tex }}-
      # The install steps stop if they hang; the build has no limit of its own, since a project's
      # Lean build can take as long as it takes.
      - name: Install elan, poppler and zstd (and TeX Live)
        timeout-minutes: 30
        run: |
          # A download stops when it stops making progress, not after a fixed time, so a slow
          # mirror costs time rather than the job. apt gives up on a server that sends nothing for
          # 30 seconds and tries again from where it stopped, then the next mirror; `fetch` also
          # stops a command that has downloaded nothing for 5 minutes (a connection can hang
          # without apt noticing) and runs it again, three times in all. The downloads share 25
          # of the step's 30 minutes. apt logs each package as it starts, with its size.
          deadline=$(( $(date +%s) + 25 * 60 ))
          fetch() {
            for i in 1 2 3; do
              left=$(( deadline - $(date +%s) ))
              [ "$left" -gt 0 ] || { echo "no time left for downloads: $*" >&2; return 1; }
              timeout "$left" "$@" & pid=$!
              # Progress is growth of the files the downloads write: apt's, and elan's in the
              # temporary directory.
              idle=0; size=
              while kill -0 "$pid" 2>/dev/null; do
                now=$(sudo du -sb /var/lib/apt/lists /var/cache/apt/archives "${TMPDIR:-/tmp}" 2>/dev/null) || true
                if [ "$now" = "$size" ]; then idle=$((idle + 1)); else size=$now; idle=0; fi
                if [ "$idle" = 300 ]; then echo "nothing downloaded for 5 minutes: $*" >&2; kill "$pid"; fi
                sleep 1
              done
              wait "$pid" && return 0
              echo "attempt $i failed: $*" >&2; sleep 10
            done
            return 1
          }
          NET="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          PKGS="poppler-utils zstd ${{ inputs.tex && 'latexmk texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended' || '' }}"
          mkdir -p ~/apt-archives
          sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fetch sudo apt-get -q $NET update
          fetch sudo apt-get -q $NET install -y --no-install-recommends --download-only $PKGS
          # The saved packages are then exactly those this install uses: the files apt would
          # download into an empty archive.
          rm -f ~/apt-archives/*.deb
          apt-get -qq install --no-install-recommends --print-uris -o Dir::Cache::Archives=/nonexistent/ $PKGS |
            sed -n "s/^'[^']*' \([^ ]*\) .*/\1/p" | (cd /var/cache/apt/archives && xargs -r cp -t ~/apt-archives/)
          echo "packages kept for the cache: $(ls ~/apt-archives | wc -l), $(du -sh ~/apt-archives | cut -f1)"
          # The packages install from what was downloaded.
          sudo apt-get install -y -qq --no-install-recommends $PKGS
          fetch sh -c 'curl -sSfL --connect-timeout 30 --max-time 120 --retry 4 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the project's Lean toolchain (a failed download is retried)
        timeout-minutes: 20
        working-directory: ${{ inputs.project-dir }}
        run: |
          [ -f lean-toolchain ] || exit 0
          for i in 1 2 3 4; do "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)" && exit 0; sleep $((i * 10)); done
          exit 1
      - name: Install MachineChecked
        timeout-minutes: 10
        run: pip install "${{ inputs.package }}"
      - name: Mathlib's cache, and a saved build of this project
        working-directory: ${{ inputs.project-dir }}
        env:
          CACHE_REPO: ${{ inputs.cache-repo }}
        run: |
          if [ -d .lake/packages/mathlib ] || grep -q mathlib lake-manifest.json; then
            lake exe cache get || echo "Mathlib's cache: not available; Lake builds it"
          fi
          if [ -n "$CACHE_REPO" ]; then
            machinechecked cache restore "$CACHE_REPO" || echo "no saved build; building from source"
          fi
      - name: Build
        working-directory: ${{ inputs.project-dir }}
        env:
          TARGETS: ${{ inputs.targets }}
        run: lake build $TARGETS
      - name: Write the audit
        working-directory: ${{ inputs.project-dir }}
        env:
          PAPER: ${{ inputs.paper }}
          AUTHOR: ${{ inputs.author }}
          SUBPATH: ${{ inputs.subpath }}
        run: |
          mkdir -p "$RUNNER_TEMP/machinechecked-audit"
          machinechecked build --site "$RUNNER_TEMP/machinechecked-audit/$SUBPATH" \
            ${AUTHOR:+--author "$AUTHOR"} ${PAPER:+"$PAPER"}
          test -f "$RUNNER_TEMP/machinechecked-audit/$SUBPATH/audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.where.outputs.artifact }}
          path: ${{ runner.temp }}/machinechecked-audit
