name: CI

# A pull request's pushes run once, as `pull_request`; a newer push cancels the older run.
# Runs on main always finish: the demo audit (pages.yml) publishes after them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job stops well above its usual duration (test about 45 minutes, the others a few), so a
# hung step fails fast instead of holding a runner for GitHub's six hours.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Lean toolchains are kept between runs, keyed on the versions the examples pin.
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-v4.24.0-${{ hashFiles('examples/*/lean-toolchain', 'tests/fixtures/*/lean-toolchain') }}
      - name: Install TeX Live and elan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-science texlive-fonts-recommended poppler-utils
          curl -sSfL --retry 4 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # The examples' toolchains, and an older Lean too: the probe must compile on the
          # versions users have (tests/simple/test_structure.py runs it on both). A download
          # that fails is retried.
          for t in leanprover/lean4:v4.24.0 $(cat examples/*/lean-toolchain tests/fixtures/*/lean-toolchain | sort -u); do
            for i in 1 2 3 4; do "$HOME/.elan/bin/elan" toolchain install "$t" && break; [ $i = 4 ] && exit 1; sleep $((i * 10)); done
          done
      - name: Install ProofLens
        run: pip install -e '.[test]'
      - name: Build the plain example (zero-configuration tests use it)
        run: cd examples/plain-paper && lake build
      - name: Prepare the preview browser
        run: cd web && npm ci && npx playwright install --with-deps chromium
      - name: Build the toy paper
        run: cd examples/toy-paper && prooflens build --fail-on-violation
      - name: Export the demo (approved fields only, scanned; data only, the Demo audit workflow publishes it)
        run: cd examples/toy-paper && prooflens export --data-only --out ../../demo-site
      - name: Capture the exported reader in both themes and viewport sizes
        run: READER=engine/python/prooflens/web node web/scripts/preview.mjs demo-site "$RUNNER_TEMP/reader-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-preview
          path: ${{ runner.temp }}/reader-preview
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo-site
          retention-days: 14

      - name: Tests (contracts, mutations, security, zero-configuration)
        run: pytest -q
      - name: An installed wheel needs no Node and no checkout
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          python -m venv /tmp/venv && /tmp/venv/bin/pip install /tmp/wheel/*.whl
          cd examples/plain-paper && /tmp/venv/bin/prooflens build --out /tmp/plain.html
          grep -q __PROOFLENS__ /tmp/plain.html


  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - name: The committed reader is the build of its sources
        run: |
          cd web && npm ci && npm run build && cd ..
          git status --porcelain -- engine/python/prooflens/web
          test -z "$(git status --porcelain -- engine/python/prooflens/web)"
      - name: The reader in a browser (web/tests)
        run: |
          cd web && npx playwright install --with-deps chromium && SHOTS="$RUNNER_TEMP/reader-shots" node tests/reader.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-screenshots
          path: ${{ runner.temp }}/reader-shots
          retention-days: 7

  # The reusable audit workflow (audit.yml), run as a researcher's repository would run it, on the
  # plain example with this checkout's MachineChecked.
  audit-workflow:
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"

  # The same workflow building a second audit into a subpath from a given ref, as a repository
  # publishing one audit per paper version does; the two artifacts merge into one site.
  audit-workflow-subpath:
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"
      ref: ${{ github.sha }}
      subpath: v1

  audit-workflow-site:
    needs: [audit-workflow, audit-workflow-subpath]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: machinechecked-audit*
          merge-multiple: true
          path: site
      - name: Both audits are in the merged site
        env:
          SUBPATH_ARTIFACT: ${{ needs.audit-workflow-subpath.outputs.artifact }}
        run: |
          test "$SUBPATH_ARTIFACT" = machinechecked-audit-v1
          test -f site/audit.json && test -f site/v1/audit.json
          test -f site/v1/data/index.json && test -f site/v1/index.html
