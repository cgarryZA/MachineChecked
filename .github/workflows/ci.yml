name: CI

# A pull request's pushes run once, as `pull_request`; a newer push cancels the older run.
# Runs on main always finish: the demo audit (pages.yml) publishes after them.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job stops well above its slowest passing runs (a test shard 12 to 20 minutes, depending on
# the runner; the others a few), so a hung step fails instead of holding a runner for six hours.
jobs:
  # The suite runs in parts on parallel runners: `pytest --shard I/N` (tests/shards.py) deals out
  # whole test files by their times in tests/durations.json, and each part sets up its own runner.
  # Shard 1 also exports the demo and checks the wheel. The `test` job passes when every part does.
  test-shard:
    name: test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Lean toolchains are kept between runs, keyed on the versions the examples pin.
      - uses: actions/cache@v6
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-v4.24.0-${{ hashFiles('examples/*/lean-toolchain', 'tests/fixtures/*/lean-toolchain') }}
      # The TeX Live packages are kept for a week, so the shards download only what changed; all
      # shards share the key, and whichever finishes first saves it.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-test-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-test-${{ runner.os }}-
      - name: Install TeX Live and elan
        run: |
          # Each download stops after 5 minutes and is tried three times, so a stalled mirror costs
          # a retry; the packages are then installed from what was downloaded.
          retry() { for i in 1 2 3; do timeout 300 "$@" && return 0; echo "attempt $i failed or stalled: $*" >&2; sleep 5; done; return 1; }
          PKGS="latexmk texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended poppler-utils"
          mkdir -p ~/apt-archives; sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          retry sudo apt-get -o Acquire::Retries=3 update -qq
          retry sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends --download-only $PKGS
          cp -n /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          sudo apt-get install -y -qq --no-install-recommends $PKGS
          retry sh -c 'curl -sSfL --connect-timeout 30 --max-time 120 --retry 4 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # The examples' toolchains, and an older Lean too: the probe must compile on the
          # versions users have (tests/simple/test_structure.py runs it on both). A download
          # that fails is retried.
          for t in leanprover/lean4:v4.24.0 $(cat examples/*/lean-toolchain tests/fixtures/*/lean-toolchain | sort -u); do
            for i in 1 2 3 4; do "$HOME/.elan/bin/elan" toolchain install "$t" && break; [ $i = 4 ] && exit 1; sleep $((i * 10)); done
          done
      - name: Install ProofLens
        run: pip install -e '.[test]'
      - name: Build the plain example (zero-configuration tests use it)
        run: cd examples/plain-paper && lake build
      - name: Build the toy paper (the tests copy its build)
        run: cd examples/toy-paper && prooflens build --fail-on-violation
      - name: The reader's npm packages (Playwright, for the preview)
        if: matrix.shard == 1
        run: cd web && npm ci
      - name: The preview browser (Playwright's Chromium, from caches when it can)
        if: matrix.shard == 1
        uses: ./.github/actions/browser
      - name: Export the demo (approved fields only, scanned; data only, the Demo audit workflow publishes it)
        if: matrix.shard == 1
        run: cd examples/toy-paper && prooflens export --data-only --out ../../demo-site
      - name: Capture the exported reader in both themes and viewport sizes
        if: matrix.shard == 1
        run: READER=engine/python/prooflens/web node web/scripts/preview.mjs demo-site "$RUNNER_TEMP/reader-preview"
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: reader-preview
          path: ${{ runner.temp }}/reader-preview
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: demo-site
          path: demo-site
          retention-days: 14

      - name: Tests (contracts, mutations, security, zero-configuration), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: pytest -q --shard ${{ matrix.shard }}/${{ strategy.job-total }} --shard-times "$RUNNER_TEMP/test-times.json"
      # Each test file's time, for rebalancing the shards (tests/shards.py says how).
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-times-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-times.json
          retention-days: 14
      - name: An installed wheel needs no Node and no checkout
        if: matrix.shard == 1
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          python -m venv /tmp/venv && /tmp/venv/bin/pip install /tmp/wheel/*.whl
          cd examples/plain-paper && /tmp/venv/bin/prooflens build --out /tmp/plain.html
          grep -q __PROOFLENS__ /tmp/plain.html

  # The check named `test`: every shard passed (a failed or cancelled shard fails it).
  test:
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard of the suite passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success

  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - name: The committed reader is the build of its sources
        run: |
          cd web && npm ci && npm run build && cd ..
          git status --porcelain -- engine/python/prooflens/web
          test -z "$(git status --porcelain -- engine/python/prooflens/web)"
      - name: The browser (Playwright's Chromium, from caches when it can)
        uses: ./.github/actions/browser
      - name: The reader in a browser (web/tests)
        run: |
          cd web && SHOTS="$RUNNER_TEMP/reader-shots" node tests/reader.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-screenshots
          path: ${{ runner.temp }}/reader-shots
          retention-days: 7

  # The reusable audit workflow (audit.yml), run as a researcher's repository would run it, on the
  # plain example with this checkout's MachineChecked.
  audit-workflow:
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"

  # The same workflow building a second audit into a subpath from a given ref, as a repository
  # publishing one audit per paper version does; the two artifacts merge into one site.
  audit-workflow-subpath:
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"
      ref: ${{ github.sha }}
      subpath: v1

  audit-workflow-site:
    needs: [audit-workflow, audit-workflow-subpath]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: machinechecked-audit*
          merge-multiple: true
          path: site
      - name: Both audits are in the merged site
        env:
          SUBPATH_ARTIFACT: ${{ needs.audit-workflow-subpath.outputs.artifact }}
        run: |
          test "$SUBPATH_ARTIFACT" = machinechecked-audit-v1
          test -f site/audit.json && test -f site/v1/audit.json
          test -f site/v1/data/index.json && test -f site/v1/index.html
