name: CI

# A pull request's pushes run once, as `pull_request`, in one concurrency group per pull request,
# so a newer push cancels the older run, running or waiting. Each push to main has a group of its
# own (its run's id), so it neither waits for nor cancels another run: every commit on main gets
# a full run, and the demo audit (pages.yml) publishes the newest one that passed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Each job stops well above its slowest passing runs (a test shard 12 to 20 minutes, depending on
# the runner; the others a few), so a hung step fails instead of holding a runner for six hours.
jobs:
  # The suite runs in parts on parallel runners: `pytest --shard I/N` (tests/shards.py) deals out
  # whole test files by their times in tests/durations.json, and each part sets up its own runner.
  # Shard 1 also exports the demo and checks the wheel. The `test` job passes when every part does.
  test-shard:
    name: test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Lean toolchains are kept between runs, keyed on the versions the examples pin.
      - uses: actions/cache@v6
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-v4.24.0-${{ hashFiles('examples/*/lean-toolchain', 'tests/fixtures/*/lean-toolchain') }}
      # The TeX Live packages a run installs are kept for a week, so the shards download only what
      # changed; all shards share the key, and whichever finishes first saves it.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-test-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: apt-test-${{ runner.os }}-
      - name: Install TeX Live and elan
        run: |
          # A download stops when it stops making progress, not after a fixed time, so a slow
          # mirror costs time rather than the job. apt gives up on a server that sends nothing for
          # 30 seconds and tries again from where it stopped, then the next mirror; `fetch` also
          # stops a command that has downloaded nothing for 5 minutes (a connection can hang
          # without apt noticing) and runs it again, three times in all. The downloads share 25
          # of the job's 60 minutes. apt logs each package as it starts, with its size.
          deadline=$(( $(date +%s) + 25 * 60 ))
          fetch() {
            for i in 1 2 3; do
              left=$(( deadline - $(date +%s) ))
              [ "$left" -gt 0 ] || { echo "no time left for downloads: $*" >&2; return 1; }
              timeout "$left" "$@" & pid=$!
              # Progress is growth of the files the downloads write: apt's, and elan's in the
              # temporary directory.
              idle=0; size=
              while kill -0 "$pid" 2>/dev/null; do
                now=$(sudo du -sb /var/lib/apt/lists /var/cache/apt/archives "${TMPDIR:-/tmp}" 2>/dev/null) || true
                if [ "$now" = "$size" ]; then idle=$((idle + 1)); else size=$now; idle=0; fi
                if [ "$idle" = 300 ]; then echo "nothing downloaded for 5 minutes: $*" >&2; kill "$pid"; fi
                sleep 1
              done
              wait "$pid" && return 0
              echo "attempt $i failed: $*" >&2; sleep 10
            done
            return 1
          }
          NET="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3"
          PKGS="latexmk texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended poppler-utils"
          mkdir -p ~/apt-archives; sudo cp -n ~/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fetch sudo apt-get -q $NET update
          fetch sudo apt-get -q $NET install -y --no-install-recommends --download-only $PKGS
          # The saved packages are then exactly those this install uses: the files apt would
          # download into an empty archive.
          rm -f ~/apt-archives/*.deb
          apt-get -qq install --no-install-recommends --print-uris -o Dir::Cache::Archives=/nonexistent/ $PKGS |
            sed -n "s/^'[^']*' \([^ ]*\) .*/\1/p" | (cd /var/cache/apt/archives && xargs -r cp -t ~/apt-archives/)
          echo "packages kept for the cache: $(ls ~/apt-archives | wc -l), $(du -sh ~/apt-archives | cut -f1)"
          # The packages install from what was downloaded.
          sudo apt-get install -y -qq --no-install-recommends $PKGS
          fetch sh -c 'curl -sSfL --connect-timeout 30 --max-time 120 --retry 4 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none'
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # The examples' toolchains, and an older Lean too: the probe must compile on the
          # versions users have (tests/simple/test_structure.py runs it on both). A download
          # that fails is retried.
          for t in leanprover/lean4:v4.24.0 $(cat examples/*/lean-toolchain tests/fixtures/*/lean-toolchain | sort -u); do
            for i in 1 2 3 4; do "$HOME/.elan/bin/elan" toolchain install "$t" && break; [ $i = 4 ] && exit 1; sleep $((i * 10)); done
          done
      # The committed reader is main's last build; the tests use the one these sources make.
      - name: Build the reader from its sources
        run: cd web && npm ci && npm run build
      - name: Install ProofLens
        run: pip install -e '.[test]'
      - name: Build the plain example (zero-configuration tests use it)
        run: cd examples/plain-paper && lake build
      - name: Build the toy paper (the tests copy its build)
        run: cd examples/toy-paper && prooflens build --fail-on-violation
      - name: The preview browser (Playwright's Chromium, from caches when it can)
        if: matrix.shard == 1
        uses: ./.github/actions/browser
      - name: Export the demo (approved fields only, scanned; data only, the Demo audit workflow publishes it)
        if: matrix.shard == 1
        run: cd examples/toy-paper && prooflens export --data-only --out ../../demo-site
      - name: Capture the exported reader in both themes and viewport sizes
        if: matrix.shard == 1
        run: READER=engine/python/prooflens/web node web/scripts/preview.mjs demo-site "$RUNNER_TEMP/reader-preview"
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: reader-preview
          path: ${{ runner.temp }}/reader-preview
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 1
        with:
          name: demo-site
          path: demo-site
          retention-days: 14

      - name: Tests (contracts, mutations, security, zero-configuration), shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: pytest -q --shard ${{ matrix.shard }}/${{ strategy.job-total }} --shard-times "$RUNNER_TEMP/test-times.json"
      # Each test file's time, for rebalancing the shards (tests/shards.py says how).
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-times-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-times.json
          retention-days: 14
      - name: An installed wheel needs no Node and no checkout
        if: matrix.shard == 1
        run: |
          pip wheel . --no-deps -w /tmp/wheel
          python -m venv /tmp/venv && /tmp/venv/bin/pip install /tmp/wheel/*.whl
          cd examples/plain-paper && /tmp/venv/bin/prooflens build --out /tmp/plain.html
          grep -q __PROOFLENS__ /tmp/plain.html

  # The check named `test`: every shard passed (a failed or cancelled shard fails it).
  test:
    needs: test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard of the suite passed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: test "$RESULT" = success

  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Two commits deep, so a pull request's merge commit can be compared with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      # The reader-bundle job commits the built reader on main; a pull request leaves it alone, so
      # two pull requests that change web/src do not conflict on it. The merge commit's first
      # parent is the base the pull request merges into.
      - name: A pull request leaves the built reader to CI
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- engine/python/prooflens/web; then
            git diff --stat HEAD^1 HEAD -- engine/python/prooflens/web
            echo "::error::This pull request changes engine/python/prooflens/web, which CI builds and commits on main. Restore it: git checkout origin/main -- engine/python/prooflens/web && git clean -fdq engine/python/prooflens/web, then commit."
            exit 1
          fi
      - name: Build the reader from its sources
        run: cd web && npm ci && npm run build
      - name: The browser (Playwright's Chromium, from caches when it can)
        uses: ./.github/actions/browser
      - name: The reader in a browser (web/tests)
        run: |
          cd web && SHOTS="$RUNNER_TEMP/reader-shots" node tests/reader.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-screenshots
          path: ${{ runner.temp }}/reader-shots
          retention-days: 7

  # After each push to main, the built reader is made to match web/src: the job builds it from the
  # latest main and commits it when it differs. Runs are serialized, so each builds on the previous
  # one's commit; a push that loses a race with another merge starts again from the new main. Its
  # commit, pushed with the workflow's token, starts no other workflow.
  reader-bundle:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: reader-bundle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Commit the built reader when it differs from its sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd web && npm ci --no-audit --no-fund && npm run build)
            git add -A engine/python/prooflens/web
            if git diff --cached --quiet; then
              echo "The committed reader matches its sources at $(git rev-parse --short HEAD)."
              exit 0
            fi
            git commit -q -m "The built reader matches its sources" \
              -m "Built by CI from web/src at $(git rev-parse --short HEAD^)."
            if git push -q origin HEAD:main; then
              echo "Committed the built reader as $(git rev-parse --short HEAD)."
              exit 0
            fi
            echo "main moved during attempt $attempt; building again from the new main"
            sleep 5
          done
          exit 1

  # Whether a pull request needs the audit-workflow checks below: it does when it changes what they
  # exercise (the workflows, the packaging, the export and published-site code, the plain example).
  # A push to main always runs them, so main is fully checked and the Demo audit waits for them.
  # Leaving them out of other pull requests lets more pull requests' runs go at once.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      audit: ${{ steps.diff.outputs.audit }}
    steps:
      # Two commits deep, so a pull request's merge commit can be compared with its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          AUDIT='^(\.github/workflows/(audit|ci)\.yml|pyproject\.toml|engine/python/prooflens/(export|published|bundle|paper)\.py|examples/plain-paper/)'
          if git diff --name-only HEAD^1 HEAD | grep -E -q "$AUDIT"; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "This pull request changes nothing the audit-workflow checks exercise; they run on main."
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi

  # The reusable audit workflow (audit.yml), run as a researcher's repository would run it, on the
  # plain example with this checkout's MachineChecked.
  audit-workflow:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"

  # The same workflow building a second audit into a subpath from a given ref, as a repository
  # publishing one audit per paper version does; the two artifacts merge into one site.
  audit-workflow-subpath:
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    uses: ./.github/workflows/audit.yml
    with:
      project-dir: examples/plain-paper
      tex: true
      package: "."
      author: "MachineChecked CI"
      ref: ${{ github.sha }}
      subpath: v1

  audit-workflow-site:
    needs: [audit-workflow, audit-workflow-subpath]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: machinechecked-audit*
          merge-multiple: true
          path: site
      - name: Both audits are in the merged site
        env:
          SUBPATH_ARTIFACT: ${{ needs.audit-workflow-subpath.outputs.artifact }}
        run: |
          test "$SUBPATH_ARTIFACT" = machinechecked-audit-v1
          test -f site/audit.json && test -f site/v1/audit.json
          test -f site/v1/data/index.json && test -f site/v1/index.html
