name: Release

# Releases a new version with no one tagging it by hand: when a push to main changes
# pyproject.toml and its version has no tag yet, this tags the commit v<version>, creates its
# GitHub release, and publishes the package to PyPI by trusted publishing (no token is stored;
# PyPI trusts this workflow, release.yml, with the environment `pypi`). To release, bump the
# version on main.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Is this version released yet?
        id: v
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.new == 'true'
        run: pip install build && python -m build
      - if: steps.v.outputs.new == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Tag and create the GitHub release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist/* \
            --target "$(git rev-parse HEAD)" --title "v${{ steps.v.outputs.version }}" \
            --notes "MachineChecked ${{ steps.v.outputs.version }}: \`uvx machinechecked view\`. Changes: https://github.com/${{ github.repository }}/commits/v${{ steps.v.outputs.version }}"

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
