[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machinechecked"
version = "0.1.14"
description = "Read a mathematical paper beside its Lean formalisation, and see claim by claim what Lean establishes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4", "pyyaml>=6"]
keywords = ["lean", "lean4", "formal verification", "formalization", "mathematics", "proof",
            "theorem prover", "mathlib", "audit", "latex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://machinechecked.org"
Documentation = "https://github.com/cgarryZA/MachineChecked/blob/main/docs/GETTING_STARTED.md"
Source = "https://github.com/cgarryZA/MachineChecked"
Issues = "https://github.com/cgarryZA/MachineChecked/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
machinechecked = "prooflens.cli:main"
prooflens = "prooflens.cli:main"

[tool.setuptools]
package-dir = { "" = "engine/python" }

[tool.setuptools.packages.find]
where = ["engine/python"]

[tool.setuptools.package-data]
prooflens = ["data/*", "data/schema/*", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
