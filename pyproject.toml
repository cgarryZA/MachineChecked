[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machinechecked"
version = "0.1.0"
description = "Read a mathematical paper beside its Lean formalisation, with the evidence for every claim."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["jsonschema>=4", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
machinechecked = "prooflens.cli:main"
prooflens = "prooflens.cli:main"

[tool.setuptools]
package-dir = { "" = "engine/python" }

[tool.setuptools.packages.find]
where = ["engine/python"]

[tool.setuptools.package-data]
prooflens = ["data/*", "data/schema/*", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
